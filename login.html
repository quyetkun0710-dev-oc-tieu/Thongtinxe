<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập hệ thống</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

<style>
body{
  background:#f4f6f8;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.login-box{
  width:100%;
  max-width:380px;
  background:#fff;
  padding:24px;
  border-radius:8px;
  box-shadow:0 5px 20px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<div class="login-box">
  <h1 class="title has-text-centered">ĐĂNG NHẬP</h1>

  <div class="field">
    <label class="label">Username</label>
    <div class="control">
      <input class="input" id="username" autocomplete="off">
    </div>
  </div>

  <div class="field">
    <label class="label">Password</label>
    <div class="control">
      <input class="input" id="password" type="password">
    </div>
  </div>

  <div class="field">
    <button class="button is-primary is-fullwidth" onclick="login()">
      Đăng nhập
    </button>
  </div>

  <p id="msg" class="has-text-danger has-text-centered"></p>
</div>

<script src="login.js"></script>
</body>
</html>
